<style>
  :root { --paper:#F2F5F4; --card:#FFFFFF; --ink:#0F2328; --ink-2:rgba(15,35,40,.72); --ink-3:rgba(15,35,40,.45); --accent:#C24A30; --spring: linear(0, .13 3%, .46 9%, .74 16%, .9 24%, .97 33%, 1.005 45%, 1.01 55%, 1); color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --paper:#0E1618; --card:#141F22; --ink:#EAF0EE; --ink-2:rgba(234,240,238,.76); --ink-3:rgba(234,240,238,.48); --accent:#EC8468; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--paper); color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; padding:24px 16px; }
  form { width:100%; max-width:340px; }
  h1 { font-size:44px; font-weight:800; letter-spacing:-.045em; line-height:1; margin:0; }
  p { margin:10px 0 0; color:var(--ink-2); font-size:16px; }
  .pin { margin-top:28px; width:100%; font:inherit; font-size:28px; font-weight:700; letter-spacing:.5em; text-align:center;
    padding:14px 0 14px .5em; border-radius:14px; border:2px solid transparent; background:var(--card); color:var(--ink); outline:none;
    transition:border-color .2s ease; }
  .pin:focus { border-color:var(--ink); }
  .pin.bad { border-color:var(--accent); animation:shake .45s var(--spring); }
  @keyframes shake { 20%{transform:translateX(-8px)} 45%{transform:translateX(6px)} 70%{transform:translateX(-3px)} }
  @media (prefers-reduced-motion: reduce) { .pin.bad { animation:none; } }
  button { margin-top:12px; width:100%; min-height:52px; font:inherit; font-size:17px; font-weight:700; border:0; border-radius:14px;
    background:var(--ink); color:var(--paper); cursor:pointer; transition:transform .35s var(--spring), opacity .2s ease; }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.5; }
  .msg { min-height:24px; margin-top:12px; font-size:14px; color:var(--ink-3); text-align:center; }
  .msg.bad { color:var(--accent); }
</style>

const KEY = "nt-unlock-v1";
const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const bu = b => btoa(String.fromCharCode(...new Uint8Array(b)));
function get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
function put(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {} }
async function unlock(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub(D.iv) }, key, ub(D.ct)));
  // Swap the whole document, then re-run its scripts in order (parsed scripts stay inert).
  const doc = new DOMParser().parseFromString(html, "text/html");
  document.replaceChild(document.importNode(doc.documentElement, true), document.documentElement);
  for (const old of [...document.querySelectorAll("script")]) {
    const s = document.createElement("script");
    for (const a of old.attributes) s.setAttribute(a.name, a.value);
    s.textContent = old.textContent;
    const done = old.src ? new Promise(r => { s.onload = s.onerror = r; }) : null;
    s.async = false;
    old.replaceWith(s);
    if (done) await done;

}
async function derive(pw) {
