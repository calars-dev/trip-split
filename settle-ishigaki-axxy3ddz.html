<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#000000" />
<title>이시가키 정산</title>
<style>
  :root {
    --bg: #000000;
    --surface: #1C1C1E;
    --surface-2: #2C2C2E;
    --line: #38383A;
    --text: #FFFFFF;
    --muted: rgba(235, 235, 245, .62);
    --faint: rgba(235, 235, 245, .32);
    --accent: #0A84FF;
    --pos: #30D158;
    --neg: #FF453A;
    --warn: #FF9F0A;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top, 0) 0 calc(env(safe-area-inset-bottom, 0px) + 40px);
  }
  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  header { padding: 28px 0 8px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; margin: 28px 4px 8px; }
  .card { background: var(--surface); border-radius: var(--radius); padding: 16px; }
  .card + .card { margin-top: 10px; }
  .num { font-variant-numeric: tabular-nums; }

  /* name picker */
  .names { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .names button {
    background: var(--surface); border-radius: 12px; padding: 12px 4px; font-size: 15px;
    transition: background-color .15s ease, transform .1s ease;
  }
  .names button:active { transform: scale(.96); }
  .names button[aria-pressed="true"] { background: var(--accent); font-weight: 600; }

  /* my result */
  #me[hidden] { display: none; }
  .verdict { padding: 20px 16px; }
  .verdict .label { color: var(--muted); font-size: 14px; }
  .verdict .big { font-size: 32px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
  .pos { color: var(--pos); } .neg { color: var(--neg); }
  .send {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 0; border-top: 1px solid var(--line);
  }
  .send:first-of-type { border-top: none; }
  .send .who { font-size: 17px; font-weight: 600; }
  .send .amt { font-size: 17px; font-weight: 600; }
  .send small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }
  .copy {
    background: var(--surface-2); border-radius: 10px; padding: 8px 12px; font-size: 14px;
    color: var(--accent); flex-shrink: 0; min-height: 36px;
  }
  .copy.done { color: var(--pos); }

  /* explanation */
  .eq { display: grid; grid-template-columns: 1fr auto; row-gap: 8px; column-gap: 12px; }
  .eq .k { color: var(--muted); }
  .eq .v { text-align: right; }
  .eq .t { font-weight: 600; color: var(--text); }
  .eq .ind { padding-left: 14px; font-size: 14px; }
  .eq hr { grid-column: 1 / -1; border: none; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
  .note { color: var(--muted); font-size: 14px; margin-top: 12px; }

  /* item list */
  .day { font-size: 13px; color: var(--muted); margin: 18px 4px 6px; }
  .item { display: grid; grid-template-columns: 1fr auto; column-gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: none; }
  .item .n { font-size: 15px; }
  .item .m { color: var(--muted); font-size: 13px; }
  .item .s { text-align: right; font-size: 15px; }
  .item .s small { display: block; color: var(--muted); font-size: 12px; }
  .item.off .n, .item.off .s { color: var(--faint); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); color: var(--muted); margin-left: 4px; vertical-align: 1px; }
  .tag.pot { color: var(--accent); }
  .tag.mine { color: var(--pos); }

  .tabs { display: flex; background: var(--surface); border-radius: 10px; padding: 2px; margin: 0 0 10px; }
  .tabs button { flex: 1; padding: 8px; border-radius: 8px; font-size: 14px; color: var(--muted); transition: background-color .15s ease; }
  .tabs button[aria-selected="true"] { background: var(--surface-2); color: var(--text); font-weight: 600; }

  .tr { display: grid; grid-template-columns: 1fr auto; padding: 11px 0; border-top: 1px solid var(--line); }
  .tr:first-child { border-top: none; }
  .tr.hl { color: var(--text); font-weight: 600; }
  .tr.dim { color: var(--muted); }
  .warnbox { border-left: 3px solid var(--warn); }
  details summary { cursor: pointer; color: var(--accent); font-size: 15px; list-style: none; padding: 4px 0; }
  details summary::-webkit-details-marker { display: none; }

  .fade { animation: fade .22s ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .fade { animation: none; }
    .names button, .tabs button { transition: none; }
  }
  footer { color: var(--faint); font-size: 12px; margin-top: 32px; text-align: center; }
</style>
</head>

<div class="wrap">
  <header>
    <h1>이시가키 정산</h1>

const won = (n) => Math.round(n).toLocaleString("ko-KR") + "원";

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// names
const namesEl = $("names");
D.people.forEach((p) => {
  const b = document.createElement("button");
  b.textContent = p;
  b.setAttribute("aria-pressed", "false");
  b.onclick = () => pick(p, true);
  namesEl.appendChild(b);
});

function copyBtn(amount) {
  return `<button class="copy" data-copy="${amount}">금액 복사</button>`;
}
document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-copy]");
  if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "복사됨"; b.classList.add("done"); }
  catch { b.textContent = b.dataset.copy; }
  setTimeout(() => { b.textContent = "금액 복사"; b.classList.remove("done"); }, 1600);
});

let view = "mine";
function pick(name, scroll) {
  [...namesEl.children].forEach((b) => b.setAttribute("aria-pressed", String(b.textContent === name)));
  try { localStorage.setItem("ishigaki-me", name); } catch {}
  history.replaceState(null, "", "#" + encodeURIComponent(name));
  renderMe(name);
  if (scroll) $("me").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}

function renderMe(me) {
  const el = $("me");
  const rows = D.rows.filter((r) => !r.settled && (r.payer === me || me in r.shares));
  const off = D.rows.filter((r) => r.settled && (r.payer === me || me in r.shares));

  let fee = 0, paid = 0, sPot = 0, sOther = 0, sSelf = 0;
  for (const r of rows) {
    if (r.payer === me) { if (r.fee) fee += r.krw; else paid += r.krw; }
    const s = r.shares[me] || 0;
    if (r.fee) continue;
    if (r.payer === "공금") sPot += s; else if (r.payer === me) sSelf += s; else sOther += s;
  }
  const bal = D.balance[me];

  const out = D.transfers.filter((t) => t.from === me);
  const inc = D.transfers.filter((t) => t.to === me);

    verdict = `<div class="label">보낼 돈</div><div class="big neg num">${won(-net)}</div>` +
      out.map((t) => `<div class="send"><div class="who">${esc(t.to)}에게</div><div style="display:flex;align-items:center;gap:10px"><span class="amt num">${won(t.amt)}</span>${copyBtn(t.amt)}</div></div>`).join("");
  } else {
    verdict = `<div class="label">받을 돈</div><div class="big pos num">${won(net)}</div>` +

      `<div class="note">받기만 하면 돼요. 보낼 곳은 없어요.</div>`;
  }
  if (net < 0 && !isT) verdict += `<div class="note">이 한 번이면 끝이에요.</div>`;

  const share = sPot + sOther + sSelf;
  let eq = `<div class="eq num">
    <div class="k t">내가 낸 돈</div><div class="v t">${won(fee + paid)}</div>
    <div class="k ind">회비</div><div class="v ind">${won(fee)}</div>
    <div class="k ind">내 카드·현금으로 결제</div><div class="v ind">${won(paid)}</div>
    <hr>
    <div class="k t">내 몫으로 쓴 돈</div><div class="v t">− ${won(share)}</div>
    <div class="k ind">공금으로 낸 것 중 내 몫</div><div class="v ind">${won(sPot)}</div>
    <div class="k ind">친구가 낸 것 중 내 몫</div><div class="v ind">${won(sOther)}</div>
    <div class="k ind">내가 낸 것 중 내 몫</div><div class="v ind">${won(sSelf)}</div>

  if (isT) eq += `
    <div class="k ind">총무로 보관 중인 공금 남은 돈</div><div class="v ind">− ${won(D.potLeft)}</div>

    <div class="k t">실제로 보낼 돈</div><div class="v t neg">${won(-net)}</div>`;
  eq += `</div>`;
  let eqNote = `<div class="note">회비 50만원은 공금 통장에 들어가서 숙소·렌터카·다 같이 먹은 저녁 같은 데 쓰였어요. 그중 내 몫은 위 "공금으로 낸 것 중 내 몫"이에요.</div>`;
  if (isT) eqNote += `<div class="note">공금 남은 돈 ${won(D.potLeft)}이 수형님 통장에 있어서, 그 돈을 친구들에게 직접 나눠 보내는 걸로 송금 횟수를 줄였어요. 수형님만 여러 번 보내는 이유예요.</div>`;

  // item list grouped by day
  const days = {};
  for (const r of rows.concat(off)) (days[r.day] ??= []).push(r);
  const list = Object.keys(days).sort((a, b) => a - b).map((d) => {
    const items = days[d].map((r) => {
      const s = r.shares[me] || 0;
      const orig = r.cur === "JPY" ? `${yen(r.amt)} · ` : "";
      const who = r.payer === "공금" ? `<span class="tag pot">공금</span>` : r.payer === me ? `<span class="tag mine">내가 냄</span>` : `<span class="tag">${esc(r.payer)}</span>`;
      const n = Object.keys(r.shares).length;
      if (r.fee) return `<div class="item"><div><div class="n">회비 입금${who}</div><div class="m">공금 통장으로</div></div><div class="s num">${won(r.krw)}<small>낸 돈</small></div></div>`;
      const right = r.settled ? `<div class="s num">—<small>그 자리에서 나눔</small></div>`
        : `<div class="s num">${s ? won(s) : "—"}<small>${s ? "내 몫" : "내 몫 없음"}${r.payer === me ? " · " + won(r.krw) + " 냄" : ""}</small></div>`;
      return `<div class="item${r.settled ? " off" : ""}"><div><div class="n">${esc(r.note || r.cat)}${who}</div><div class="m">${orig}${won(r.krw)} · ${n}명</div></div>${right}</div>`;
    }).join("");
    return `<div class="day">${DAY[d] ?? d + "일차"}</div><div class="card">${items}</div>`;
  }).join("");

  el.innerHTML = `
    <h2>${esc(me)}님</h2>
    <div class="card verdict fade">${verdict}</div>
    <h2>왜 이 금액인가요</h2>
    <div class="card fade">${eq}${eqNote}</div>
    <h2>내가 낀 지출 · ${rows.length + off.length}건</h2>
    <div class="fade">${list}</div>
    ${off.length ? `<div class="note" style="padding:0 4px">흐리게 보이는 건 그 자리에서 이미 나눠 낸 거라 계산에서 뺐어요.</div>` : ""}`;
  el.hidden = false;
  renderAll(me);
}

// pot
(() => {
  const fees = D.rows.filter((r) => r.fee).reduce((a, r) => a + r.krw, 0);
  const potRows = D.rows.filter((r) => r.payer === "공금" && !r.fee);
  const spent = potRows.reduce((a, r) => a + r.krw, 0);
  $("pot").innerHTML = `
    <div class="eq num">
      <div class="k t">회비 14명 × 50만원</div><div class="v t">${won(fees)}</div>
      ${potRows.map((r) => `<div class="k ind">${DAY[r.day]} · ${esc(r.note)}${r.cur === "JPY" ? ` (${yen(r.amt)})` : ""}</div><div class="v ind">− ${won(r.krw)}</div>`).join("")}
      <hr>
      <div class="k t">남은 돈 (총무 ${esc(D.treasurer)} 보관)</div><div class="v t">${won(fees - spent)}</div>
    </div>
    <div class="note">공금 지출은 전부 14명이 똑같이 나눴어요.</div>
    <details style="margin-top:10px"><summary>스노클링은 왜 여기 없나요?</summary>
      <div class="note" style="margin-top:6px">출발 전에 공금으로 결제한 푸른동굴 투어(1,667,793원)는 환불돼 공금으로 돌아왔어요. 대신 현지에서 이중민님이 거북이투어(¥189,694)를 결제했고, 간 사람 ${esc(D.tour.n)}명이 나눠요${D.tour.out.length ? ` (${D.tour.out.map(esc).join(", ")} 제외)` : ""}.</div>
    </details>`;
})();

// all transfers
function renderAll(me) {
  $("all").innerHTML = D.transfers.map((t) => {
    const cls = me && (t.from === me || t.to === me) ? "hl" : me ? "dim" : "";
    return `<div class="tr ${cls}"><div>${esc(t.from)} → ${esc(t.to)}</div><div class="num">${won(t.amt)}</div></div>`;
  }).join("") + `<div class="note">14명이 서로 주고받는 걸 13번 송금으로 줄였어요. 이보다 적게는 안 돼요. 수형님 말고는 모두 한 번만 보내면 돼요.</div>`;
}
renderAll(null);

let start = null;
try { start = decodeURIComponent(location.hash.slice(1)) || localStorage.getItem("ishigaki-me"); } catch {}
if (start && D.people.includes(start)) pick(start, false);
</script>
</body>
</html>
